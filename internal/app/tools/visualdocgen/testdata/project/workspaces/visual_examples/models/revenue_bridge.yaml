apiVersion: leapview.dev/v1
kind: ModelTable
metadata:
  workspace: visual_examples
  name: revenue_bridge
  title: Revenue bridge
spec:
  primaryKey: component
  sources: [docs.revenue_bridge]
  fields:
    component: {label: Driver, type: string}
    amount: {label: Revenue impact, type: number}
  transform:
    sql: |
      SELECT component, CAST(amount AS DOUBLE) AS amount
      FROM source."docs.revenue_bridge"
