targets:
  - name: leapview-v1
    typespec_dir: .
    typespec_entrypoint: typespec/main.tsp
    ir_out: gen/json-ir.json
    openapi_out: gen/openapi.yaml
    go_out:
      unmatched: error
      packages:
        LeapViewAPI: &leapview_api_go_package
          dir: ../internal/app/api/gen
          package: gen
          import_path: github.com/Yacobolo/leapview/internal/app/api/gen
        LeapViewAPI.Access: *leapview_api_go_package
        LeapViewAPI.Agent: *leapview_api_go_package
        LeapViewAPI.Dashboard: *leapview_api_go_package
        LeapViewAPI.Deployment: *leapview_api_go_package
        LeapViewAPI.ManagedData: *leapview_api_go_package
        LeapViewAPI.Project: *leapview_api_go_package
        LeapViewAPI.Refresh: *leapview_api_go_package
        LeapViewAPI.Release: *leapview_api_go_package
        LeapViewAPI.Workspace: *leapview_api_go_package
    cli_out:
      dir: ../internal/app/cli/gen
      package: gen
    contract_imports:
      LeapViewVisualization:
        go_package: github.com/Yacobolo/leapview/internal/dashboard/visualization/ir
        go_alias: visualizationir
        typescript_module: ../visualization
  - name: ui-signals
    kind: contracts
    typespec_dir: .
    typespec_entrypoint: signals/main.tsp
    ir_out: gen/ui-signals-ir.json
    ts_out: ../web/generated/signals/index.ts
    contract_imports:
      LeapViewVisualization:
        go_package: github.com/Yacobolo/leapview/internal/dashboard/visualization/ir
        go_alias: visualizationir
        typescript_module: ../visualization
  - name: visualization-ir
    kind: contracts
    typespec_dir: .
    typespec_entrypoint: visualization/main.tsp
    ir_out: gen/visualization-ir.json
    go_models_out: ../internal/dashboard/visualization/ir/models.gen.go
    go_models_package: ir
    ts_out: ../web/generated/visualization/index.ts
    json_schema_out: gen/visualization.schema.json
  - name: agent-tool-contracts
    kind: contracts
    typespec_dir: ../internal/agent/contracts
    typespec_entrypoint: typespec/main.tsp
    ir_out: ../internal/agent/contracts/gen/agent-tools-ir.json
    go_models_out: ../internal/agent/contracts/models.gen.go
    go_models_package: contracts
    json_schema_out: ../internal/agent/contracts/gen/agent-tools.schema.json
