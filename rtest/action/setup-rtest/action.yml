name: Set up rtest
description: Install a verified rtest release and configure GitHub OIDC access to a shared service.

inputs:
  version:
    description: Exact rtest release version to install.
    required: false
    default: "0.7.0"
  repository:
    description: GitHub repository that owns rtest-v* release assets.
    required: false
    default: flidai/leapview
  allow-source-fallback:
    description: Build the checked-out rtest source only when the pinned release is not published yet.
    required: false
    default: "false"
  service-url:
    description: HTTPS URL of the rtest control plane.
    required: true
  project:
    description: rtest project slug or ID authorized for this workflow.
    required: true
  image:
    description: Optional digest-pinned OCI image override; the project default is used when omitted.
    required: false
  ca-certificate:
    description: Optional PEM CA certificate when the service does not use a publicly trusted HTTPS certificate.
    required: false
  oidc-audience:
    description: GitHub OIDC audience; defaults to the service URL.
    required: false
  job-cpus:
    description: CPU limit and reservation for each test job.
    required: false
    default: "2"
  job-memory:
    description: Memory limit and reservation for each test job.
    required: false
    default: 4g

outputs:
  install-source:
    description: Whether the CLI came from cache, a verified release, or the source fallback.
    value: ${{ steps.install.outputs.source }}

runs:
  using: composite
  steps:
    - name: Restore pinned rtest CLI
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rtest/bin
        key: rtest-cli-${{ inputs.repository }}-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install pinned rtest CLI
      id: install
      shell: bash
      env:
        RTEST_VERSION: ${{ inputs.version }}
        RTEST_REPOSITORY: ${{ inputs.repository }}
        RTEST_ALLOW_SOURCE_FALLBACK: ${{ inputs.allow-source-fallback }}
        RTEST_INSTALL_ROOT: ${{ runner.temp }}/rtest
        RTEST_ACTION_ROOT: ${{ github.action_path }}/../..
      run: "${GITHUB_ACTION_PATH}/install-release.sh"

    - name: Cache verified rtest release
      if: steps.cache.outputs.cache-hit != 'true' && steps.install.outputs.source == 'release'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rtest/bin
        key: rtest-cli-${{ inputs.repository }}-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Configure rtest
      shell: bash
      env:
        INPUT_SERVICE_URL: ${{ inputs.service-url }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_CA_CERTIFICATE: ${{ inputs.ca-certificate }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        INPUT_JOB_CPUS: ${{ inputs.job-cpus }}
        INPUT_JOB_MEMORY: ${{ inputs.job-memory }}
      run: |
        set -euo pipefail
        install_root="${RUNNER_TEMP}/rtest"
        bin_dir="${install_root}/bin"
        config_file="${install_root}/config.json"
        ca_file=""

        if [[ -n "${INPUT_CA_CERTIFICATE}" ]]; then
          ca_file="${install_root}/ca.pem"
          umask 077
          printf '%s\n' "${INPUT_CA_CERTIFICATE}" > "${ca_file}"
          chmod 0600 "${ca_file}"
        fi

        audience="${INPUT_OIDC_AUDIENCE:-${INPUT_SERVICE_URL}}"
        umask 077
        jq -n \
          --arg url "${INPUT_SERVICE_URL}" \
          --arg image "${INPUT_IMAGE}" \
          --arg ca "${ca_file}" \
          --arg audience "${audience}" \
          --arg cpus "${INPUT_JOB_CPUS}" \
          --arg memory "${INPUT_JOB_MEMORY}" \
          '{
            backend: "service",
            url: $url,
            service: ({cpus: $cpus, memory: $memory, oidc_audience: $audience}
              + if $image == "" then {} else {image: $image} end
              + if $ca == "" then {} else {ca_cert_file: $ca} end)
          }' > "${config_file}"
        chmod 0600 "${config_file}"

        printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"
        printf 'RTEST_CONFIG=%s\n' "${config_file}" >> "${GITHUB_ENV}"
        printf 'RTEST_PROJECT=%s\n' "${INPUT_PROJECT}" >> "${GITHUB_ENV}"
