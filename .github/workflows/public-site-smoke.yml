name: Public adoption smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: public-adoption-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify public installation journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Verify DNS, TLS, canonical redirects, release manifest, guide, and artifacts
        run: bun scripts/public_site_smoke.ts

      - name: Verify anonymous immutable image access
        run: |
          image="$(jq -er '.image' docs/public-release.json)"
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$image" >/dev/null
