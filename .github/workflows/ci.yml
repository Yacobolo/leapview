name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx53-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cx53-benchmark:
    name: LeapView CX53 benchmark
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Initialize persistent caches
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          docker image inspect "${RUNNER_IMAGE}" >/dev/null
          cache_specs=(
            "leapview-actions-go-build:/tmp/runner/.cache/go-build"
            "leapview-actions-go-mod:/go/pkg/mod"
            "leapview-actions-bun:/tmp/runner/.bun/install/cache"
            "leapview-actions-terraform:/tmp/runner/.cache/terraform"
          )
          for cache_spec in "${cache_specs[@]}"; do
            cache="${cache_spec%%:*}"
            path="${cache_spec#*:}"
            docker volume inspect "${cache}" >/dev/null 2>&1 || docker volume create "${cache}" >/dev/null
            docker run --rm \
              --volume "${cache}:${path}" \
              "${RUNNER_IMAGE}" \
              chown -R "$(id -u):$(id -g)" "${path}"
          done

      - name: Run the fast PR contract
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          container_name="leapview-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          docker run --rm \
            --name "${container_name}" \
            --network host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume leapview-actions-go-build:/tmp/runner/.cache/go-build \
            --volume leapview-actions-go-mod:/go/pkg/mod \
            --volume leapview-actions-bun:/tmp/runner/.bun/install/cache \
            --volume leapview-actions-terraform:/tmp/runner/.cache/terraform \
            --workdir /workspace \
            --env HOME=/tmp/runner \
            --env BUN_INSTALL_CACHE_DIR=/tmp/runner/.bun/install/cache \
            --env TF_PLUGIN_CACHE_DIR=/tmp/runner/.cache/terraform \
            "${RUNNER_IMAGE}" \
            task ci:pr
