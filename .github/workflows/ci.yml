name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autback-ci:
    name: Autback CI
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
      }}
    environment: autback
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Autback
        uses: flidai/autback/action/setup-autback@279ad057f28480e53470323401379e96f8b65afc
        with:
          version: 0.1.5
          service-url: ${{ vars.AUTBACK_SERVICE_URL }}
          project: leapview
          ca-certificate: ${{ vars.AUTBACK_CA_CERTIFICATE }}

      - name: Check shared worker
        run: autback doctor

      - name: Build the immutable CI environment
        id: runner
        env:
          IMAGE_REPOSITORY: ghcr.io/flidai/leapview
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/autback-runner-image.json"
          image_tag="${IMAGE_REPOSITORY}:autback-ci-${GITHUB_SHA}"
          autback build -- \
            --file Dockerfile.autback \
            --platform linux/amd64 \
            --push \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          immutable_image="${IMAGE_REPOSITORY}@${digest}"
          printf 'image=%s\n' "${immutable_image}" >> "${GITHUB_OUTPUT}"
          printf 'CI environment: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run the complete CI contract remotely
        env:
          AUTBACK_RUNNER_IMAGE: ${{ steps.runner.outputs.image }}
        run: >-
          ./scripts/autback_exec.sh --image "${AUTBACK_RUNNER_IMAGE}" --timeout 90m
          --cache go-build=/root/.cache/go-build
          --cache go-mod=/go/pkg/mod
          --cache bun=/root/.bun/install/cache
          --cache terraform=/root/.cache/terraform
          -- task ci

      - name: Build and qualify the production image remotely
        env:
          AUTBACK_RUNNER_IMAGE: ${{ steps.runner.outputs.image }}
          IMAGE_REPOSITORY: ghcr.io/flidai/leapview
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/leapview-image.json"
          image_tag="${IMAGE_REPOSITORY}:ci-${GITHUB_SHA}"
          autback build -- \
            --file Dockerfile \
            --platform linux/amd64 \
            --push \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          immutable_image="${IMAGE_REPOSITORY}@${digest}"
          ./scripts/autback_exec.sh --image "${AUTBACK_RUNNER_IMAGE}" --timeout 30m \
            --cache go-build=/root/.cache/go-build \
            --cache go-mod=/go/pkg/mod \
            --cache bun=/root/.bun/install/cache \
            -- ./scripts/qualify_production_image.sh "${immutable_image}"
          printf 'Production image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and smoke-test the public site image remotely
        env:
          AUTBACK_RUNNER_IMAGE: ${{ steps.runner.outputs.image }}
          IMAGE_REPOSITORY: ghcr.io/flidai/leapview-site
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/leapview-site-image.json"
          image_tag="${IMAGE_REPOSITORY}:ci-${GITHUB_SHA}"
          autback build -- \
            --file Dockerfile.site \
            --platform linux/amd64 \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          immutable_image="${IMAGE_REPOSITORY}@${digest}"
          ./scripts/autback_exec.sh --image "${AUTBACK_RUNNER_IMAGE}" --timeout 15m -- \
            ./scripts/smoke_site_image.sh "${immutable_image}"
          printf 'Public site image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"

  github-ci:
    name: GitHub CI (external pull request)
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.50.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Run the complete CI contract
        run: task ci

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [autback-ci, github-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the applicable trust path
        env:
          AUTBACK_RESULT: ${{ needs.autback-ci.result }}
          GITHUB_RESULT: ${{ needs.github-ci.result }}
        run: |
          case "${AUTBACK_RESULT}:${GITHUB_RESULT}" in
            success:skipped|skipped:success) exit 0 ;;
            *)
              printf 'Autback CI: %s\nGitHub CI: %s\n' "${AUTBACK_RESULT}" "${GITHUB_RESULT}" >&2
              exit 1
              ;;
          esac
