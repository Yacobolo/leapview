name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-ci:
    name: GitHub-hosted PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Run the fast PR contract
        run: task ci:pr

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [github-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require GitHub-hosted validation
        env:
          GITHUB_CI_RESULT: ${{ needs.github-ci.result }}
        run: |
          test "${GITHUB_CI_RESULT}" = success || {
            printf 'GitHub-hosted CI: %s\n' "${GITHUB_CI_RESULT}" >&2
            exit 1
          }
