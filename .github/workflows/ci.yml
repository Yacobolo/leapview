name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cx53-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cx53-benchmark:
    name: LeapView CX53 benchmark
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Initialize persistent caches
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          docker image inspect "${RUNNER_IMAGE}" >/dev/null
          cache_specs=(
            "leapview-actions-go-build:/root/.cache/go-build"
            "leapview-actions-go-pkg:/go/pkg"
            "leapview-actions-bun:/root/.bun/install/cache"
            "leapview-actions-terraform:/root/.cache/terraform"
          )
          for cache_spec in "${cache_specs[@]}"; do
            cache="${cache_spec%%:*}"
            path="${cache_spec#*:}"
            docker volume inspect "${cache}" >/dev/null 2>&1 || docker volume create "${cache}" >/dev/null
            docker run --rm \
              --volume "${cache}:${path}" \
              "${RUNNER_IMAGE}" \
              true
          done

      - name: Run the fast PR contract
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          container_name="leapview-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
            docker run --rm \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              "${RUNNER_IMAGE}" \
              chown -R "$(id -u):$(id -g)" /workspace
          }
          trap cleanup EXIT INT TERM
          docker run --rm \
            --name "${container_name}" \
            --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume leapview-actions-go-build:/root/.cache/go-build \
            --volume leapview-actions-go-pkg:/go/pkg \
            --volume leapview-actions-bun:/root/.bun/install/cache \
            --volume leapview-actions-terraform:/root/.cache/terraform \
            --workdir /workspace \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            "${RUNNER_IMAGE}" \
            task ci:pr
