name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      execution_backend:
        description: Execution backend for a manual run
        required: true
        default: autback
        type: choice
        options:
          - autback
          - cx53

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autback-ci:
    name: Autback PR validation
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.execution_backend != 'cx53') ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      }}
    environment: autback
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Classify runner contract
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]] &&
             ! git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- Dockerfile.autback; then
            echo "runner=true" >> "${GITHUB_OUTPUT}"
          else
            echo "runner=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Buildx
        if: ${{ steps.changes.outputs.runner == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: ${{ steps.changes.outputs.runner == 'true' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Autback
        uses: flidai/autback/action/setup-autback@238fef7b2d2f145a4b8a96cb0051d65ad26909aa
        with:
          version: 0.1.12
          service-url: ${{ vars.AUTBACK_SERVICE_URL }}
          project: leapview
          ca-certificate: ${{ vars.AUTBACK_CA_CERTIFICATE }}

      - name: Check shared worker
        run: autback doctor

      - name: Build candidate runner
        id: runner
        if: ${{ steps.changes.outputs.runner == 'true' }}
        env:
          IMAGE_REPOSITORY: ghcr.io/flidai/leapview
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/autback-runner-image.json"
          image_tag="${IMAGE_REPOSITORY}:autback-ci-${GITHUB_SHA}"
          autback build -- \
            --file Dockerfile.autback \
            --platform linux/amd64 \
            --push \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Run the fast PR contract remotely
        env:
          CANDIDATE_RUNNER: ${{ steps.runner.outputs.image }}
        run: |
          set -euo pipefail
          command=(autback exec --timeout 90m)
          if [[ -n "${CANDIDATE_RUNNER}" ]]; then
            command+=(--image "${CANDIDATE_RUNNER}")
          fi
          command+=(
            --cache go-build=/root/.cache/go-build
            --cache go-mod=/go/pkg/mod
            --cache bun=/root/.bun/install/cache
            --cache terraform=/root/.cache/terraform
            -- task ci:pr
          )
          "${command[@]}"

  github-ci:
    name: GitHub CI (external pull request)
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.50.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Run the fast PR contract
        run: task ci:pr

  cx53-benchmark:
    name: LeapView CX53 benchmark
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_backend == 'cx53' }}
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          # This runner is restricted to trusted LeapView jobs. Preserve generated
          # files and node_modules so unchanged runs keep Go's test-input cache hot.
          clean: false

      - name: Initialize persistent caches
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          docker image inspect "${RUNNER_IMAGE}" >/dev/null
          cache_specs=(
            "leapview-actions-go-build:/root/.cache/go-build"
            "leapview-actions-go-pkg:/go/pkg"
            "leapview-actions-bun:/root/.bun/install/cache"
            "leapview-actions-terraform:/root/.cache/terraform"
          )
          for cache_spec in "${cache_specs[@]}"; do
            cache="${cache_spec%%:*}"
            path="${cache_spec#*:}"
            docker volume inspect "${cache}" >/dev/null 2>&1 || docker volume create "${cache}" >/dev/null
            docker run --rm \
              --volume "${cache}:${path}" \
              "${RUNNER_IMAGE}" \
              true
          done

      - name: Run the fast PR contract
        shell: bash
        env:
          RUNNER_IMAGE: leapview-ci:cx53
        run: |
          set -euo pipefail
          container_name="leapview-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
            docker run --rm \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              "${RUNNER_IMAGE}" \
              chown -R "$(id -u):$(id -g)" /workspace
          }
          trap cleanup EXIT INT TERM
          docker run --rm \
            --name "${container_name}" \
            --network host \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume leapview-actions-go-build:/root/.cache/go-build \
            --volume leapview-actions-go-pkg:/go/pkg \
            --volume leapview-actions-bun:/root/.bun/install/cache \
            --volume leapview-actions-terraform:/root/.cache/terraform \
            --workdir /workspace \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            "${RUNNER_IMAGE}" \
            task ci:pr

  ci-gate:
    name: CI gate
    if: ${{ always() && inputs.execution_backend != 'cx53' }}
    needs: [autback-ci, github-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the applicable trust path
        env:
          AUTBACK_RESULT: ${{ needs.autback-ci.result }}
          GITHUB_RESULT: ${{ needs.github-ci.result }}
        run: |
          case "${AUTBACK_RESULT}:${GITHUB_RESULT}" in
            success:skipped|skipped:success) exit 0 ;;
            *)
              printf 'Autback CI: %s\nGitHub CI: %s\n' "${AUTBACK_RESULT}" "${GITHUB_RESULT}" >&2
              exit 1
              ;;
          esac
