name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, stacked]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.stack.id || github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go tests (PR)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: task ci:prepare

      - name: Run Go validation
        run: task ci:lane:go

      - name: Verify generated artifacts
        run: task generated:check

  frontend-validation:
    name: Frontend tests (PR)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"

      - name: Prepare generated and embedded assets
        run: task ci:prepare

      - name: Run frontend validation
        run: task ci:lane:frontend

      - name: Verify generated artifacts
        run: task generated:check

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [go-validation, frontend-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require GitHub-hosted validation
        env:
          GO_RESULT: ${{ needs.go-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
        run: |
          if [[ "${GO_RESULT}" = skipped && "${FRONTEND_RESULT}" = skipped ]]; then
            printf '%s\n' 'Validation is deferred to the top of this stack.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          test "${GO_RESULT}" = success || {
            printf 'Go validation: %s\n' "${GO_RESULT}" >&2
            exit 1
          }
          test "${FRONTEND_RESULT}" = success || {
            printf 'Frontend validation: %s\n' "${FRONTEND_RESULT}" >&2
            exit 1
          }
