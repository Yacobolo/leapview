name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted-ci:
    name: Self-hosted PR validation
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          # This runner group accepts only trusted LeapView jobs. Keeping the
          # worktree warm preserves generated inputs and Go test-cache hits.
          clean: false

      - name: Run the fast PR contract
        run: scripts/run_ci_container.sh task ci:pr

  github-ci:
    name: GitHub CI (external pull request)
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.actor == 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.50.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Run the fast PR contract
        run: task ci:pr

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [self-hosted-ci, github-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the applicable trust path
        env:
          SELF_HOSTED_RESULT: ${{ needs.self-hosted-ci.result }}
          GITHUB_RESULT: ${{ needs.github-ci.result }}
        run: |
          case "${SELF_HOSTED_RESULT}:${GITHUB_RESULT}" in
            success:skipped|skipped:success) exit 0 ;;
            *)
              printf 'Self-hosted CI: %s\nGitHub CI: %s\n' "${SELF_HOSTED_RESULT}" "${GITHUB_RESULT}" >&2
              exit 1
              ;;
          esac
