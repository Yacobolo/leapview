name: Autback runner image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: autback-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'flidai/leapview'
    environment: autback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Autback
        uses: flidai/autback/action/setup-autback@6aa834ba184e18ea2d4fef4b785332fa500f8871
        with:
          version: 0.1.7
          service-url: ${{ vars.AUTBACK_SERVICE_URL }}
          project: leapview
          ca-certificate: ${{ vars.AUTBACK_CA_CERTIFICATE }}

      - name: Check shared worker
        run: autback doctor

      - name: Build and activate the project runner
        env:
          AUTBACK_RUNNER_IMAGE: ghcr.io/flidai/leapview:autback-${{ github.sha }}
        run: >-
          autback image build --tag "${AUTBACK_RUNNER_IMAGE}"
          --file Dockerfile.autback -- --platform linux/amd64
