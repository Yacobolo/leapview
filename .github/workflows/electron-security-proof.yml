name: Electron security proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-security-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Policy and manifest contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run pure security contract tests
        working-directory: internal/app/testing/maliciousinstance/electron
        run: node --test policy.test.mjs manifest-proof.test.mjs

  packages:
    name: Hardened package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build, harden, inspect, and launch the package
        if: runner.os != 'Linux'
        working-directory: desktop
        run: bun run make

      - name: Build, harden, inspect, and launch the package under Xvfb
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          bun run build
          bun scripts/run-electron.mjs make
          sudo chown root:root out/LeapView-linux-*/chrome-sandbox
          sudo chmod 4755 out/LeapView-linux-*/chrome-sandbox
          xvfb-run --auto-servernum node scripts/verify-package.mjs

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leapview-desktop-${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error
          path: desktop/out/make/**/*.zip

  macos:
    name: Candidate proof (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        env:
          LEAPVIEW_ELECTRON_BINARY: ${{ github.workspace }}/internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: |
          go test -count=1 \
            -run TestElectronCandidatePreservesBrowserEquivalentAuthority \
            -v ./internal/app/testing/maliciousinstance

  windows:
    name: Candidate proof (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        shell: pwsh
        run: |
          $env:LEAPVIEW_ELECTRON_BINARY = Join-Path $env:GITHUB_WORKSPACE "internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/electron.exe"
          go test -count=1 -run TestElectronCandidatePreservesBrowserEquivalentAuthority -v ./internal/app/testing/maliciousinstance

  linux:
    name: Candidate proof (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build sandboxed proof image
        run: |
          docker build \
            --file internal/app/testing/maliciousinstance/electron/Dockerfile.linux \
            --tag leapview-electron-security-proof:43.2.0 .

      - name: Run complete malicious-instance proof
        run: |
          docker run --rm --cap-add=SYS_ADMIN \
            leapview-electron-security-proof:43.2.0
