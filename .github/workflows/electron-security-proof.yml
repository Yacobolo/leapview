name: Electron security proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-security-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Policy and manifest contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run pure security contract tests
        working-directory: internal/app/testing/maliciousinstance/electron
        run: node --test policy.test.mjs manifest-proof.test.mjs

  packages:
    name: Hardened package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            format: deb
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            format: dmg
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
            format: exe

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Set up Go for native Windows policy verification
        if: runner.os == 'Windows'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test native Windows policy probe
        if: runner.os == 'Windows'
        run: go test ./desktop/native/windowspolicy

      - name: Install Debian package tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build, harden, inspect, and launch the package
        if: runner.os != 'Linux'
        working-directory: desktop
        run: bun run make

      - name: Build, harden, inspect, and launch the package under Xvfb
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          bun run build
          bun scripts/run-electron.mjs make
          sudo chown root:root out/LeapView-linux-*/chrome-sandbox
          sudo chmod 4755 out/LeapView-linux-*/chrome-sandbox
          xvfb-run --auto-servernum node scripts/verify-package.mjs
          node scripts/verify-installer.mjs

      - name: Generate and verify release evidence
        working-directory: desktop
        run: bun run evidence

      - name: Qualify Linux install, upgrade, protocol, and uninstall
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          installer="$(find out/make -type f -name '*.deb' -print -quit)"
          scripts/qualify-installer-linux.sh "$installer"

      - name: Qualify macOS consumer install, protocol, and removal
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          installer="$(find out/make -type f -name '*.dmg' -print -quit)"
          scripts/qualify-consumer-macos.sh "$installer"

      - name: Qualify Windows per-user install, protocol, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $installer = Get-ChildItem -Path out/make -Recurse -Filter *.exe |
            Select-Object -First 1 -ExpandProperty FullName
          ./scripts/qualify-consumer-windows.ps1 $installer

      - name: Upload verifiable unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leapview-desktop-${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/out/make/**/*.zip
            desktop/out/make/**/*.deb
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/RELEASES
            desktop/out/evidence/**
            desktop/release-policy.json

  attest:
    name: Attest main candidate (${{ matrix.name }})
    if: ${{ github.event_name == 'push' }}
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifact: linux-x64
            format: deb
          - name: macOS Intel
            artifact: macos-x64
            format: dmg
          - name: Windows x64
            artifact: windows-x64
            format: exe

    steps:
      - name: Download candidate and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leapview-desktop-${{ matrix.artifact }}
          path: candidate

      - name: Verify downloaded evidence bundle
        shell: bash
        run: |
          artifact="$(find candidate/out/make -type f -name '*.${{ matrix.format }}' -print -quit)"
          manifest="$(find candidate/out/evidence -type f -name '*.release.json' -print -quit)"
          sbom="$(find candidate/out/evidence -type f -name '*.spdx.json' -print -quit)"
          update_arguments=()
          if [[ "$artifact" == *.dmg ]]; then
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name '*.zip' -print -quit)")
          elif [[ "$artifact" == *.exe ]]; then
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name '*.nupkg' -print -quit)")
            update_arguments+=(--update-artifact "$(find candidate/out/make -type f -name 'RELEASES' -print -quit)")
          fi
          node candidate/out/evidence/verify-release-evidence.mjs \
            --artifact "$artifact" \
            --checksums candidate/out/evidence/checksums.txt \
            --manifest "$manifest" \
            --policy candidate/release-policy.json \
            --sbom "$sbom" \
            "${update_arguments[@]}"

      - name: Attest candidate provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            candidate/out/make/**/*.${{ matrix.format }}
            candidate/out/make/**/*.zip
            candidate/out/make/**/*.nupkg
            candidate/out/make/**/RELEASES
            candidate/out/evidence/*.release.json

      - name: Attest candidate SBOM
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            candidate/out/make/**/*.${{ matrix.format }}
            candidate/out/make/**/*.zip
            candidate/out/make/**/*.nupkg
            candidate/out/make/**/RELEASES
          sbom-path: candidate/out/evidence/*.spdx.json

  macos:
    name: Candidate proof (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        env:
          LEAPVIEW_ELECTRON_BINARY: ${{ github.workspace }}/internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: |
          go test -count=1 \
            -run TestElectronCandidatePreservesBrowserEquivalentAuthority \
            -v ./internal/app/testing/maliciousinstance

  windows:
    name: Candidate proof (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install pinned Electron
        working-directory: internal/app/testing/maliciousinstance/electron
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Run complete malicious-instance proof
        shell: pwsh
        run: |
          $env:LEAPVIEW_ELECTRON_BINARY = Join-Path $env:GITHUB_WORKSPACE "internal/app/testing/maliciousinstance/electron/node_modules/electron/dist/electron.exe"
          go test -count=1 -run TestElectronCandidatePreservesBrowserEquivalentAuthority -v ./internal/app/testing/maliciousinstance

  linux:
    name: Candidate proof (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build sandboxed proof image
        run: |
          docker build \
            --file internal/app/testing/maliciousinstance/electron/Dockerfile.linux \
            --tag leapview-electron-security-proof:43.2.0 .

      - name: Run complete malicious-instance proof
        run: |
          docker run --rm --cap-add=SYS_ADMIN \
            leapview-electron-security-proof:43.2.0
