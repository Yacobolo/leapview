name: Nightly CI

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci-${{ github.repository }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly CI
    if: github.repository == 'flidai/leapview'
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          clean: false

      - name: Run exhaustive validation
        run: scripts/run_ci_container.sh task ci:nightly
