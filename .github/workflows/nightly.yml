name: Nightly CI

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci-${{ github.repository }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Prepare generated and embedded assets
        run: task ci:prepare

      - name: Run Go validation
        run: task ci:lane:go

      - name: Verify generated artifacts
        run: task generated:check

  frontend-validation:
    name: Frontend tests (nightly)
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"

      - name: Prepare generated and embedded assets
        run: task ci:prepare

      - name: Run frontend validation
        run: task ci:lane:frontend

      - name: Verify generated artifacts
        run: task generated:check

  full-validation:
    name: Full nightly validation
    if: github.repository == 'flidai/leapview'
    needs: [go-validation, frontend-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "true"
          terraform: "true"

      - name: Prepare generated and embedded assets
        run: task ci:prepare

      - name: Run merge-only validation
        run: task ci:full:extras

  security-validation:
    name: Nightly dependency security
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci
        with:
          browser: "false"

      - name: Run dependency security scans
        run: task ci:nightly:extras

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [go-validation, frontend-validation, full-validation, security-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exhaustive nightly validation
        env:
          GO_RESULT: ${{ needs.go-validation.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          SECURITY_RESULT: ${{ needs.security-validation.result }}
        run: |
          for result in "${GO_RESULT}" "${FRONTEND_RESULT}" "${FULL_RESULT}" "${SECURITY_RESULT}"; do
            test "${result}" = success || {
              printf 'Nightly validation result: %s\n' "${result}" >&2
              exit 1
            }
          done
