name: Nightly CI

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ci-${{ github.repository }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly CI
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Run exhaustive validation
        run: task ci:nightly
