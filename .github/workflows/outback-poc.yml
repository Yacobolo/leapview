name: Outback POC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: outback-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'flidai/leapview'
    # Retain the deployed environment name during the zero-downtime Outback rename.
    environment: rtest-poc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go for Outback source fallback
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.12
          cache: false

      - name: Set up Outback
        uses: flidai/outback/action/setup-outback@7165c332778f6456e7f46f4cd79f11da6116d1e4
        with:
          version: 0.1.0
          allow-source-fallback: true
          service-url: ${{ vars.RTEST_SERVICE_URL }}
          project: leapview
          ca-certificate: ${{ vars.RTEST_CA_CERTIFICATE }}

      - name: Check worker dependencies
        run: outback doctor

      - name: Run the LeapView Testcontainers lifecycle remotely
        run: >-
          outback exec --timeout 20m --cpus 3.5 --memory 6g --
          task benchmark:testcontainers:lifecycle
