name: Outback POC

on:
  workflow_dispatch:
    inputs:
      publish_runner:
        description: Build and push the project runner image for administrator activation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: outback-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'flidai/leapview'
    # Retain the deployed environment name during the zero-downtime Outback rename.
    environment: rtest-poc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go for Outback source fallback
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.12
          cache: false

      - name: Set up Buildx
        if: ${{ inputs.publish_runner }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_runner }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Outback
        uses: flidai/outback/action/setup-outback@7165c332778f6456e7f46f4cd79f11da6116d1e4
        with:
          version: 0.1.0
          allow-source-fallback: true
          service-url: ${{ vars.RTEST_SERVICE_URL }}
          project: leapview
          ca-certificate: ${{ vars.RTEST_CA_CERTIFICATE }}

      - name: Check worker dependencies
        run: outback doctor

      - name: Publish immutable project runner image
        if: ${{ inputs.publish_runner }}
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/outback-runner-image.json"
          image_tag="ghcr.io/flidai/leapview:outback-${GITHUB_SHA}"
          outback build -- \
            --file Dockerfile.outback \
            --platform linux/amd64 \
            --push \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          immutable_image="ghcr.io/flidai/leapview@${digest}"
          printf 'Runner image: `%s`\n' "${immutable_image}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Run the LeapView Testcontainers lifecycle remotely
        run: >-
          outback exec --timeout 20m --cpus 3.5 --memory 6g --
          task benchmark:testcontainers:lifecycle
