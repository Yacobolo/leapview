name: Merge validation

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-validation-${{ github.repository }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: CI gate
    if: github.repository == 'flidai/leapview'
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          clean: false

      - name: Validate the exact merge group
        run: scripts/run_ci_container.sh task ci:full
