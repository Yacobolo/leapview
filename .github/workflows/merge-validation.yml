name: Merge validation

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-validation-${{ github.repository }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full merge validation
    if: github.repository == 'flidai/leapview'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out merge group
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Validate the exact merge group
        run: task ci:full

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [full-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full merge validation
        env:
          FULL_VALIDATION_RESULT: ${{ needs.full-validation.result }}
        run: |
          test "${FULL_VALIDATION_RESULT}" = success || {
            printf 'Full merge validation: %s\n' "${FULL_VALIDATION_RESULT}" >&2
            exit 1
          }
