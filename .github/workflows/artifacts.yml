name: Main artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-artifacts
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify main artifacts
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on:
      group: leapview-ci
      labels: [self-hosted, Linux, X64, leapview, cx53]
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          clean: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and qualify the production image
        env:
          IMAGE_REPOSITORY: ghcr.io/flidai/leapview
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/leapview-image.json"
          image_tag="${IMAGE_REPOSITORY}:main-${GITHUB_SHA}"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --push \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "${metadata_file}" \
            --tag "${image_tag}" \
            .
          digest="$(jq -er '."containerimage.digest" | select(startswith("sha256:"))' "${metadata_file}")"
          immutable_image="${IMAGE_REPOSITORY}@${digest}"
          scripts/run_ci_container.sh task image:qualify:production IMAGE="${immutable_image}"
          printf 'Production image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"
