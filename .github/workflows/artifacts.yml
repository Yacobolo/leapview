name: Main artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-artifacts
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/flidai/leapview

jobs:
  build-production-image:
    name: Build production image
    if: github.repository == 'flidai/leapview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the production image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE_REPOSITORY }}:main-${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,mode=max,scope=production-amd64,ignore-error=true
          provenance: mode=max
          sbom: true

  qualify-production-image:
    name: Qualify production image
    needs: build-production-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the cached CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Qualify the immutable production image
        env:
          IMAGE_DIGEST: ${{ needs.build-production-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" == sha256:* ]]
          immutable_image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          task image:qualify:production IMAGE="${immutable_image}"
          printf 'Production image: `%s`\n' "${immutable_image}" >> "${GITHUB_STEP_SUMMARY}"
